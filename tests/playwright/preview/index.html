<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parallax Pilot Screen Preview</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0a0a0a;
        color: #f5f5f5;
        font: 14px/1.4 ui-monospace, monospace;
      }

      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(560px, 1fr) 360px;
      }

      .stage {
        display: grid;
        place-items: center;
        padding: 40px;
        background:
          radial-gradient(circle at 30% 20%, rgba(255, 212, 0, 0.08), transparent 25%),
          radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.05), transparent 18%),
          #060606;
      }

      #watch-shell {
        padding: 24px;
        border-radius: 36px;
        background: linear-gradient(145deg, #161616, #090909);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      #watch {
        position: relative;
        overflow: hidden;
        background: #000;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      .panel {
        padding: 28px 24px;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
        background: #0d0d0d;
      }

      h1 {
        margin: 0 0 10px;
        color: #ffd400;
        font-size: 22px;
      }

      #status {
        display: inline-block;
        margin-bottom: 18px;
        padding: 6px 10px;
        border: 1px solid #ffd400;
      }

      pre {
        margin: 0;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #070707;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@zos/device": "/tests/playwright/preview/mocks/zos/device.js",
          "@zos/router": "/tests/playwright/preview/mocks/zos/router.js",
          "@zos/ui": "/tests/playwright/preview/mocks/zos/ui.js",
          "@zos/utils": "/tests/playwright/preview/mocks/zos/utils.js",
          "@zos/interaction": "/tests/playwright/preview/mocks/zos/interaction.js",
          "@zos/sensor": "/tests/playwright/preview/mocks/zos/sensor.js",
          "@zos/storage": "/tests/playwright/preview/mocks/zos/storage.js",
          "@zos/settings": "/tests/playwright/preview/mocks/zos/settings.js",
          "@zos/timer": "/tests/playwright/preview/mocks/zos/timer.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="layout">
      <section class="stage">
        <div id="watch-shell">
          <div id="watch"></div>
        </div>
      </section>
      <aside class="panel">
        <h1>Screen Preview</h1>
        <div id="status">loading</div>
        <pre id="meta"></pre>
      </aside>
    </div>
    <script type="module" src="/tests/playwright/preview/app.js"></script>
  </body>
</html>
