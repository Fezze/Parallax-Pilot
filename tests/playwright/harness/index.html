<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parallax Pilot Harness</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #050505;
        color: #f5f5f5;
        font: 14px/1.4 monospace;
      }

      h1 {
        margin: 0 0 16px;
        color: #ffd400;
        font-size: 22px;
      }

      #status {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 10px;
        border: 1px solid #ffd400;
      }

      pre {
        margin: 0;
        padding: 16px;
        border: 1px solid #333;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Parallax Pilot Harness</h1>
    <div id="status">loading</div>
    <pre id="results"></pre>
    <script type="module">
      import {
        calculateDifficulty,
        createAsteroid,
        createScoreEntry,
        createShipRect,
      } from '/zepp-app/shared/game-core.js'
      import { parseRouteParams } from '/zepp-app/shared/params.js'
      import { sanitizeSettings } from '/zepp-app/shared/persistence.js'
      import {
        buildScoreRow,
        formatDurationMs,
        paginateScores,
      } from '/zepp-app/shared/view-models.js'
      import {
        resolveTravelDirection,
      } from '/zepp-app/shared/device.js'

      const viewport = { width: 480, height: 480 }
      const shipRect = createShipRect(viewport, 240, 'left')
      const asteroid = createAsteroid({
        id: 'browser-a1',
        viewport,
        difficulty: 6,
        shipRect,
        asteroids: [],
        wristSide: 'left',
        random: () => 0.5,
      })
      const entry = createScoreEntry(4321, {
        controlMode: 'touch',
        wristSide: 'right',
        timeScale: 2,
        spawnMultiplier: 1.3,
      }, 123456)
      const scores = paginateScores([entry], 0, 7)
      const payload = {
        route: parseRouteParams('{"page":2,"mode":"harness"}'),
        difficulty: calculateDifficulty(5000, 1.5),
        travelDirection: resolveTravelDirection('left'),
        settings: sanitizeSettings({
          controlMode: 'touch',
          wristSide: 'right',
          timeScale: '2',
          spawnMultiplier: 1.3,
          tiltSensitivity: 0.95,
        }),
        asteroid: {
          x: asteroid.x,
          y: asteroid.y,
          vx: asteroid.vx,
        },
        row: buildScoreRow(entry, 0),
        duration: formatDurationMs(entry.survivedMs),
        scores,
      }

      window.__HARNESS__ = payload
      document.querySelector('#status').textContent = 'ready'
      document.querySelector('#results').textContent = JSON.stringify(payload, null, 2)
    </script>
  </body>
</html>
